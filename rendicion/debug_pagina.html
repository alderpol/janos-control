<script type="text/javascript">
function opciones(a)
{
	var xhttp = new XMLHttpRequest();

	xhttp.onreadystatechange = function() {
		if (this.readyState == 4 && this.status == 200) {
			document.getElementById("trabajo").innerHTML = xhttp.responseText;
			validar_dataset();
		}
	};

	xhttp.open("POST", "opciones.php", true);
	xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
	xhttp.send("dato="+a);
}

function validar_dataset()
{
	var trabajo = document.getElementById("trabajo");
	var dataFecha = document.getElementById("data_fecha");
	var dataObservaciones = document.getElementById("data_observaciones");

	if(!trabajo || trabajo.selectedIndex < 0)
	{
		dataFecha.value = "0";
		dataObservaciones.value = "0";
		return;
	}

	var option = trabajo.options[trabajo.selectedIndex];

	dataFecha.value = option.getAttribute("data-fecha") || "0";
	dataObservaciones.value = option.getAttribute("data-observaciones") || "0";
}

setInterval(function () {
	var xhttp = new XMLHttpRequest();

	xhttp.onreadystatechange = function() {
		if (this.readyState == 4 && this.status == 200) {
			try {
				var data = JSON.parse(this.responseText);

				if (data.bloqueado) {
					alert(data.mensaje);
					window.location.href = 'login.html';
				}
			} catch(e) {
				console.log('Error al interpretar respuesta de bloqueo');
			}
		}
	};

	xhttp.open("GET", "nueva.php?check_bloqueo=1&t=" + new Date().getTime(), true);
	xhttp.send();

}, 2000);
</script><div id="ui-datepicker-div" class="ui-datepicker ui-widget ui-widget-content ui-helper-clearfix ui-corner-all"></div></body></html>
