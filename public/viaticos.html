<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b2a86">
  <title>Calculadora de viáticos · Janos Control</title>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-2: #e8c97a;
      --gold-soft: rgba(201,168,76,.12);
      --gold-border: rgba(201,168,76,.25);
      --ink: #f0eaf8;
      --ink-2: #c4b8d8;
      --muted: #7c6f94;
      --line-2: rgba(255,255,255,.12);
      --surface: #1a1325;
      --surface-2: #221932;
      --bg: #0f0a18;
      --input-bg: #1e1530;
      --input-border: rgba(255,255,255,.1);
      --shadow: 0 8px 32px rgba(0,0,0,.4);
      --radius: 12px;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; }
    html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
      display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
    }
    .viaticos-wrap { width:100%; max-width:560px; }
    .viaticos-back { display:inline-flex; align-items:center; gap:6px; color:var(--ink-2); text-decoration:none; font-size:13px; margin-bottom:18px; }
    .viaticos-back:hover { color:var(--ink); }
    .viaticos-card { background:var(--surface); border:1px solid var(--line-2); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:28px; }
    .viaticos-head { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
    .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; background: linear-gradient(135deg, var(--gold), #a87830); border-radius: 11px; font-family: Georgia, serif; font-size: 22px; color: #1a1000; font-weight: 900; box-shadow: 0 4px 14px rgba(201,168,76,.3); flex-shrink:0; }
    .viaticos-eyebrow { color:var(--muted); font-size:12px; margin:0 0 2px; text-transform:uppercase; letter-spacing:.04em; }
    .viaticos-title { margin:0; font-size:20px; color:var(--ink); }
    input[type="range"] { accent-color: var(--gold); }
    input[type="number"], input[type="text"] { font: inherit; background:var(--input-bg); border:1px solid var(--input-border); border-radius:8px; color:var(--ink); padding:6px 8px; }
    input[type="text"] { width:100%; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
    details summary::-webkit-details-marker { color: var(--ink-2); }
    .maps-box { background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--radius); padding:1rem; margin-bottom:1.5rem; }
    .maps-field { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
    .maps-field label { font-size:13px; color:var(--ink-2); }
    .maps-btn { background:var(--gold); color:#1a1000; border:0; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .maps-btn:hover { background:var(--gold-2); }
    .maps-btn:disabled { opacity:.6; cursor:default; }
    .maps-msg { font-size:12.5px; margin:8px 0 0; }
    .maps-msg.error { color:#f0a; color:#ff8a8a; }
    .maps-msg.success { color:var(--gold-2); }
  </style>
</head>
<body>
  <div class="viaticos-wrap">
    <div class="viaticos-card">
      <div class="viaticos-head">
        <div class="brand-mark">J</div>
        <div>
          <p class="viaticos-eyebrow">Janos Control</p>
          <h1 class="viaticos-title">Calculadora de viáticos</h1>
        </div>
      </div>

      <h2 class="sr-only">Calculadora interactiva de viáticos por kilometraje</h2>

      <div class="maps-box">
        <div class="maps-field">
          <label for="origin">Dirección de origen</label>
          <input type="text" id="origin" placeholder="Ej. Av. Corrientes 1000, CABA">
        </div>
        <div class="maps-field">
          <label for="destination">Dirección de destino</label>
          <input type="text" id="destination" placeholder="Ej. Ruta Panamericana Km 34, Pilar">
        </div>
        <button type="button" class="maps-btn" id="calcDistanceBtn">Calcular distancia con Google Maps</button>
        <p id="mapsMsg" class="maps-msg" style="display:none;"></p>
      </div>

      <div style="display:flex; align-items:center; gap:12px; margin:0 0 1.5rem;">
        <label for="km" style="font-size:14px; color:var(--ink-2); min-width:150px;">Km totales (ida y vuelta)</label>
        <input type="range" id="km" min="0" max="300" step="1" value="54" style="flex:1;" />
        <span id="km-out" style="font-size:14px; font-weight:500; min-width:60px; text-align:right; color:var(--ink);">54 km</span>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:1.5rem;">
        <div style="background:var(--surface-2); border-radius:var(--radius); padding:1rem;">
          <p style="font-size:13px; color:var(--ink-2); margin:0 0 4px;">Tramo 1 (franquicia)</p>
          <p id="t1" style="font-size:20px; font-weight:500; margin:0; color:var(--ink);">$0</p>
        </div>
        <div style="background:var(--surface-2); border-radius:var(--radius); padding:1rem;">
          <p style="font-size:13px; color:var(--ink-2); margin:0 0 4px;">Tramo 2</p>
          <p id="t2" style="font-size:20px; font-weight:500; margin:0; color:var(--ink);">$0</p>
        </div>
        <div style="background:var(--surface-2); border-radius:var(--radius); padding:1rem;">
          <p style="font-size:13px; color:var(--ink-2); margin:0 0 4px;">Tramo 3 (excedente)</p>
          <p id="t3" style="font-size:20px; font-weight:500; margin:0; color:var(--ink);">$0</p>
        </div>
      </div>

      <div style="background:var(--gold-soft); border:1px solid var(--gold-border); border-radius:var(--radius); padding:1rem 1.25rem; display:flex; align-items:baseline; justify-content:space-between;">
        <span style="font-size:14px; color:var(--gold-2);">Total a abonar</span>
        <span id="total" style="font-size:24px; font-weight:500; color:var(--gold-2);">$0</span>
      </div>

      <details style="margin-top:1.5rem;">
        <summary style="font-size:13px; color:var(--ink-2); cursor:pointer;">Parámetros de tramos</summary>
        <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <label style="font-size:13px; color:var(--ink-2); min-width:170px;">Franquicia (km sin cargo)</label>
            <input type="number" id="lim1" value="40" min="0" style="width:90px;" />
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <label style="font-size:13px; color:var(--ink-2); min-width:170px;">Límite tramo 2 (km acumulados)</label>
            <input type="number" id="lim2" value="90" min="0" style="width:90px;" />
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <label style="font-size:13px; color:var(--ink-2); min-width:170px;">Tarifa tramo 2 ($/km)</label>
            <input type="number" id="rate2" value="2000" min="0" style="width:90px;" />
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <label style="font-size:13px; color:var(--ink-2); min-width:170px;">Tarifa tramo 3 ($/km)</label>
            <input type="number" id="rate3" value="1000" min="0" style="width:90px;" />
          </div>
        </div>
      </details>
    </div>
  </div>

  <script>
    const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');
    function recalc(){
      const km = parseFloat(document.getElementById('km').value) || 0;
      const lim1 = parseFloat(document.getElementById('lim1').value) || 0;
      const lim2 = parseFloat(document.getElementById('lim2').value) || 0;
      const rate2 = parseFloat(document.getElementById('rate2').value) || 0;
      const rate3 = parseFloat(document.getElementById('rate3').value) || 0;

      const km1 = Math.min(km, lim1);
      const km2 = Math.max(0, Math.min(km, lim2) - lim1);
      const km3 = Math.max(0, km - lim2);

      const m1 = 0;
      const m2 = km2 * rate2;
      const m3 = km3 * rate3;

      document.getElementById('km-out').textContent = Math.round(km) + ' km';
      document.getElementById('t1').textContent = fmt(m1);
      document.getElementById('t2').textContent = fmt(m2);
      document.getElementById('t3').textContent = fmt(m3);
      document.getElementById('total').textContent = fmt(m1 + m2 + m3);
    }
    ['km','lim1','lim2','rate2','rate3'].forEach(id => {
      document.getElementById(id).addEventListener('input', recalc);
    });
    recalc();

    const calcBtn = document.getElementById('calcDistanceBtn');
    const mapsMsg = document.getElementById('mapsMsg');

    function showMapsMsg(text, type){
      mapsMsg.textContent = text;
      mapsMsg.className = 'maps-msg' + (type ? ' ' + type : '');
      mapsMsg.style.display = 'block';
    }

    calcBtn.addEventListener('click', async () => {
      const origin = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      if (!origin || !destination) {
        showMapsMsg('Completá origen y destino.', 'error');
        return;
      }

      calcBtn.disabled = true;
      calcBtn.textContent = 'Calculando…';
      mapsMsg.style.display = 'none';

      try {
        const res = await fetch('/api/distance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ origin, destination }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo calcular la distancia.');

        const roundTripKm = Math.round(data.km * 2 * 10) / 10;
        const kmInput = document.getElementById('km');
        kmInput.max = Math.max(Number(kmInput.max), Math.ceil(roundTripKm));
        kmInput.value = roundTripKm;
        recalc();

        showMapsMsg(`${data.distanceText} (ida) · ${roundTripKm} km ida y vuelta cargados abajo.`, 'success');
      } catch (err) {
        showMapsMsg(err.message || 'Error al calcular la distancia.', 'error');
      } finally {
        calcBtn.disabled = false;
        calcBtn.textContent = 'Calcular distancia con Google Maps';
      }
    });
  </script>
</body>
</html>
